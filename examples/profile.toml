# Copy this folder to profiles/<your-name>/ and fill it in.
# profiles/ is gitignored, so your location stays on your computer.

[home]
# Used to work out distance. Only the first half (e.g. "SW1A") is ever sent
# to a lookup service, unless you give lat/lon below.
postcode = "SW1A 1AA"
# Optional, more exact. Find yours by right-clicking your house in Google Maps.
# lat = 51.501
# lon = -0.142

# Gumtree area name, as it appears in Gumtree addresses (e.g. "croydon").
gumtree_area = "westminster"
